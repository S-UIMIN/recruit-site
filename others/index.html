<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<title>ビジネス職 採用｜S'UIMIN 採用サイト</title>
<meta name="description" content="S'UIMIN ビジネス職の採用情報。現在、募集中の求人はありません。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   S'UIMIN Recruit LP  —  clean responsive rebuild
   Figma(Dev Mode)出力を保守しやすい構造に再設計
   画像は差し替え前提のプレースホルダー( .ph )で配置
   ========================================================= */

/* ---------- Design tokens ---------- */
:root{
  --font:'Gothic A1','Zen Kaku Gothic New',sans-serif;
  --purple:#702082;          /* brand primary */
  --purple-deep:#5C3472;
  --purple-soft:#8F87BB;
  --purple-mid:#9187BF;
  --orange:#F7931E;
  --ink:#333333;
  --ink-soft:#5b5b66;
  --line:#e4e0ec;
  --lilac:#F8F5FC;
  --lilac-2:#E3E1FF;
  --lilac-3:#DED9EC;
  --pink-1:#F993B7;
  --pink-2:#E874CE;
  --pink-3:#FFB9B5;
  --creed-1:#AD79C9;
  --creed-2:#DF93C8;
  --creed-3:#EE9BC7;
  --shadow-sm:0 6px 18px rgba(80,50,110,.10);
  --shadow-md:0 14px 34px rgba(80,50,110,.14);
  --radius:20px;
  --radius-lg:24px;
  --container:1200px;
  --nav-h:80px;
}

/* ---------- Reset / base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 10px);-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:var(--font);
  color:var(--ink);
  background:#FFFFFF;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
ul{margin:0;padding:0;list-style:none}

.container{width:100%;max-width:var(--container);margin-inline:auto;padding-inline:24px}

/* ---------- Reusable: section heading ---------- */
.section-head{text-align:center;margin-bottom:40px}
.section-head h2{
  font-size:clamp(22px,3vw,26px);font-weight:700;color:var(--purple);letter-spacing:.02em;
}
.section-head .bar{display:block;width:55px;height:3px;border-radius:99px;background:var(--purple);margin:14px auto 0}
.section-head .lead{
  margin-top:18px;color:var(--ink);font-size:clamp(14px,1.6vw,17px);font-weight:500;
  max-width:820px;margin-inline:auto;
}

/* ---------- Reusable: buttons ---------- */
.btn{
  --arw:0px;
  display:inline-flex;align-items:center;justify-content:center;gap:12px;
  font-weight:700;font-size:clamp(15px,1.6vw,18px);line-height:1;
  padding:18px 34px;border-radius:99px;border:2px solid transparent;
  cursor:pointer;transition:transform .2s ease,box-shadow .2s ease,background .2s ease,color .2s ease;
  white-space:nowrap;
}
.btn .arw{transition:transform .25s ease}
.btn:hover .arw{transform:translateX(6px)}
.btn--primary{background:var(--orange);color:#fff;box-shadow:0 10px 24px rgba(247,147,30,.34)}
.btn--primary:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(247,147,30,.42)}
.btn--outline{background:#FFFFFF;color:var(--purple);border-color:var(--purple)}
.btn--outline:hover{background:var(--purple);color:#fff;transform:translateY(-2px)}
.btn--fill{background:var(--purple);color:#fff}
.btn--fill:hover{background:var(--purple-deep);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.btn--sm{padding:12px 26px;font-size:15px}

/* ---------- Reusable: placeholder blocks ---------- */
.ph{
  position:relative;overflow:hidden;border-radius:16px;
  background:
     radial-gradient(120% 120% at 20% 0%, #efe8f8 0%, rgba(239,232,248,0) 55%),
     linear-gradient(135deg,#ece6f6 0%,#f6f2fb 100%);
  display:flex;align-items:center;justify-content:center;
}
.ph::after{
  content:attr(data-label);
  font-size:13px;font-weight:600;letter-spacing:.04em;color:#a99cc0;
  padding:6px 12px;border:1px dashed #c9bede;border-radius:99px;background:rgba(255,255,255,.55);
}

/* =========================================================
   NAVIGATION
   ========================================================= */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:100;height:var(--nav-h);
  display:flex;align-items:center;
  background:rgba(255,255,255,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(112,32,130,.08);
}
.nav__inner{display:flex;align-items:center;justify-content:space-between;gap:24px;width:100%;max-width:1360px;margin-inline:auto;padding-inline:28px}
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:800;color:var(--purple-deep);font-size:26px;letter-spacing:.06em}
.logo__moon{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 68% 34%,#fff 0 44%,transparent 46%),conic-gradient(from 210deg,var(--purple) 0 62%,var(--pink-2) 100%);box-shadow:0 0 0 3px rgba(112,32,130,.08)}
.logo small{font-size:11px;font-weight:600;color:var(--purple-soft);letter-spacing:.18em;align-self:flex-end;margin-bottom:4px}
.nav__links{display:flex;align-items:center;gap:26px}
.nav__links a{font-size:15px;font-weight:500;color:var(--ink);position:relative;padding:6px 0}
.nav__links a::after{content:"";position:absolute;left:0;bottom:0;width:0;height:2px;background:var(--purple);transition:width .25s ease}
.nav__links a:hover{color:var(--purple)}
.nav__links a:hover::after{width:100%}
.nav__cta{display:flex;align-items:center;gap:16px}
.nav__links .btn{display:none} /* entry button in link list is for the mobile dropdown only */
.nav__links a.btn--outline:hover{color:#fff}
.nav__burger{display:none;width:44px;height:44px;border:0;background:transparent;cursor:pointer;flex-direction:column;justify-content:center;gap:6px}
.nav__burger span{display:block;height:2px;width:26px;background:var(--purple);margin-inline:auto;transition:.3s}
.nav__toggle{position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0}
.nav__toggle:checked ~ .nav__cta .nav__burger span:nth-child(1){transform:translateY(8px) rotate(45deg)}
.nav__toggle:checked ~ .nav__cta .nav__burger span:nth-child(2){opacity:0}
.nav__toggle:checked ~ .nav__cta .nav__burger span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}

/* =========================================================
   HERO  (illustrated cloud band + floating animation)
   ========================================================= */
.hero{position:relative;overflow:hidden;padding-top:var(--nav-h);isolation:isolate;
  background:#FFFFFF}
.hero__banner{position:relative;width:100%;max-width:1440px;margin-inline:auto;aspect-ratio:1440/730;z-index:1}
.hero__band{position:absolute;left:50%;top:-5%;transform:translateX(-50%);width:108vw;height:auto;z-index:0;pointer-events:none;user-select:none}
.cloudimg{position:absolute;height:auto;z-index:2;will-change:transform;filter:drop-shadow(0 16px 22px rgba(90,70,130,.16))}
.c-man{left:2%;top:2%;width:22%}
.c-sleep{left:30%;top:7%;width:40%;z-index:3}
.c-woman{left:74%;top:31%;width:24%}
.c-empty{left:-4%;top:41%;width:19%;z-index:1;filter:none}
.c-empty2{left:81%;top:-8%;width:22%;z-index:1;filter:none}


/* copy overlay (title left, buttons right) */
.hero__copy{position:absolute;left:50%;transform:translateX(-50%);bottom:2%;z-index:5;
  width:100%;max-width:1440px;display:flex;justify-content:space-between;align-items:flex-end;
  gap:30px;padding-inline:clamp(20px,4vw,64px)}
.hero__title{font-size:clamp(24px,3.4vw,44px);font-weight:700;line-height:1.5;color:var(--ink);letter-spacing:.01em}
.hero__actions{display:flex;flex-direction:column;gap:14px;align-items:stretch;flex:0 0 auto}
.marker{
  background-image:linear-gradient(90deg,var(--pink-1),var(--purple-soft));
  background-repeat:no-repeat;background-position:0 90%;background-size:100% .42em;
  padding-inline:.04em;border-radius:2px;
}
.marker--warm{background-image:linear-gradient(90deg,var(--pink-3),var(--pink-2))}

/* floating keyframes */
@keyframes floatA{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes floatB{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
@keyframes twinkle{0%,100%{opacity:.45}50%{opacity:1}}
.c-man{animation:floatA 5s ease-in-out infinite}
.c-sleep{animation:floatB 6.6s ease-in-out infinite .5s}
.c-woman{animation:floatA 5.6s ease-in-out infinite 1s}
.c-empty{animation:floatB 7.2s ease-in-out infinite .3s}
.c-empty2{animation:floatA 8s ease-in-out infinite .8s}

/* =========================================================
   ABOUT (私たちについて)
   ========================================================= */
.section{padding:84px 0}
.about{background:#FFFFFF}
.about__grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:center}
.about__img{width:100%;aspect-ratio:481/300;border-radius:var(--radius)}
.about__lead{font-size:clamp(20px,2.4vw,28px);font-weight:700;line-height:2;letter-spacing:-.01em;color:var(--ink)}
.about__lead .em{color:var(--purple)}
.about__body{margin-top:22px;color:var(--ink-soft);font-size:16px;line-height:2}
.about__actions{margin-top:30px}

/* =========================================================
   JOBS (募集職種)
   ========================================================= */
.jobs__panel{background:var(--lilac);border-radius:var(--radius-lg);padding:44px}
.jobs__grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.jobcard{
  background:#FFFFFF;border-radius:var(--radius);box-shadow:var(--shadow-sm);
  padding:28px;display:flex;gap:22px;align-items:center;transition:transform .2s,box-shadow .2s;
}
.jobcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.jobcard--wide{grid-column:1 / -1}
.jobcard__icon{flex:0 0 auto;width:96px;height:96px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(150deg,#efe9f7,#f7f3fc)}
.jobcard__icon svg{width:52px;height:52px}
.jobcard__body{flex:1;min-width:0}
.jobcard__tag{display:inline-block;font-size:13px;font-weight:700;color:#fff;background:var(--purple-soft);padding:4px 12px;border-radius:99px;margin-bottom:10px}
.jobcard__title{font-size:clamp(19px,2vw,23px);font-weight:700;color:var(--purple);line-height:1.5}
.jobcard__desc{margin-top:8px;color:var(--ink-soft);font-size:14.5px}
.jobcard__foot{margin-top:18px}
.jobcard--wide .jobcard__inner{display:flex;gap:26px;align-items:center;width:100%;flex-wrap:wrap}
.jobcard--wide .jobcard__main{flex:1;display:flex;align-items:center;gap:20px}
.jobcard--wide .jobcard__foot{margin-top:0;margin-left:auto}

/* =========================================================
   CREED (求める人物像 / よ・あ・け)
   ========================================================= */
.creed{position:relative;overflow:hidden;background:#FFFFFF}
.creed__bg{position:absolute;top:50%;right:-30px;transform:translateY(-50%);height:86%;width:auto;z-index:0;pointer-events:none;user-select:none}
.creed>.container{position:relative;z-index:1}
.creed__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.creed-card{background:#FFFFFF;border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:38px 26px 32px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;transition:transform .25s}
.creed-card:hover{transform:translateY(-6px)}
.creed-card__kana{font-family:var(--font);font-weight:800;font-size:clamp(52px,6vw,74px);line-height:1.05;margin:0}
.creed-card:nth-child(1) .creed-card__kana{color:var(--creed-1)}
.creed-card:nth-child(2) .creed-card__kana{color:var(--creed-2)}
.creed-card:nth-child(3) .creed-card__kana{color:var(--creed-3)}
.creed-card__title{font-size:clamp(17px,2vw,21px);font-weight:800;color:var(--ink);margin:0}
.creed-card__img{width:auto;height:auto;max-width:82%;max-height:140px;object-fit:contain;margin:8px 0 4px}
.creed-card__text{color:var(--ink-soft);font-size:14.5px;line-height:1.9;margin:0}

/* =========================================================
   MEMBERS (一緒に働く仲間)
   ========================================================= */
.members{position:relative;overflow:hidden;background:#FFFFFF}
.members__blob{position:absolute;top:8%;left:-5%;width:32%;max-width:400px;height:auto;z-index:0;pointer-events:none;user-select:none;opacity:1}
.members>.container{position:relative;z-index:1}
/* online-meeting window */
.meet{position:relative;width:100%;max-width:1120px;margin:0 auto;aspect-ratio:1733/1076;filter:drop-shadow(0 24px 44px rgba(60,45,90,.24))}
.meet__bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:0}
.meet__grid{position:absolute;left:8%;right:8%;top:9.5%;bottom:16%;z-index:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2.2% 2.4%}
.meet__tile{width:100%;height:100%;object-fit:cover;border-radius:10px;background:#FFFFFF}
.meet__tile--logo{background:#3a4043}
.meet__logo{position:relative;height:100%;width:100%;border-radius:10px;overflow:hidden;background:#3a4043}
.meet__logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.meet__bar{position:absolute;left:50%;transform:translateX(-50%);bottom:3.4%;width:34%;min-width:170px;z-index:2}
.meet__icons{position:absolute;right:4%;bottom:5%;width:14%;min-width:66px;z-index:2}

/* =========================================================
   BENEFITS (福利厚生)
   ========================================================= */
.benefits__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.benefit{
  background:#FFFFFF;border-radius:var(--radius-lg);box-shadow:var(--shadow-md);
  padding:36px 30px;display:flex;gap:22px;align-items:center;transition:transform .2s;
}
.benefit:hover{transform:translateY(-5px)}
.benefit__icon{flex:0 0 auto;width:78px;height:78px;border-radius:18px;display:grid;place-items:center}
.benefit:nth-child(1) .benefit__icon{background:var(--lilac-3)}
.benefit:nth-child(2) .benefit__icon{background:#dfe3f5}
.benefit:nth-child(3) .benefit__icon{background:#f6e6f1}
.benefit__icon svg{width:40px;height:40px}
.benefit__title{font-size:17px;font-weight:800;color:var(--purple);line-height:1.55}
.benefit__title small{display:block;font-size:13.5px;font-weight:500;color:var(--ink-soft);margin-top:6px}

/* =========================================================
   OFFICE (働く環境)
   ========================================================= */
.office__grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-bottom:32px}
.office-card{background:var(--lilac);border-radius:var(--radius-lg);padding:26px}
.office-card__head{display:flex;align-items:center;gap:10px;margin-bottom:16px;color:var(--purple);font-weight:700;font-size:18px}
.office-card__head svg{width:24px;height:24px}
.office-card__img{width:100%;aspect-ratio:558/300;border-radius:14px}
.office-card__foot{margin-top:14px;display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px;font-weight:500}
.office-card__foot svg{width:16px;height:16px}
.office__info{display:grid;grid-template-columns:1fr 1px 1fr;gap:40px;align-items:stretch;background:var(--lilac);border-radius:var(--radius-lg);padding:34px 44px}
.office__info .divider{background:var(--purple);opacity:.4;width:2px;border-radius:2px}
.info-block h3{display:flex;align-items:center;gap:10px;color:var(--purple);font-weight:700;font-size:18px;margin-bottom:12px}
.info-block h3 svg{width:22px;height:22px}
.info-block p{color:var(--ink);font-weight:600;font-size:15.5px}
.info-block .muted{color:var(--ink-soft);font-weight:400;font-size:14px;line-height:1.9;margin-top:8px}

/* =========================================================
   FLOW (応募フロー)
   ========================================================= */
.flow{padding-block:12px}
.flow__job{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.flow__job h3{font-size:clamp(20px,2.3vw,28px);font-weight:700;color:var(--purple)}
.flow__row{display:flex;gap:10px;margin-bottom:56px}
.flow__row:last-child{margin-bottom:0}
.step{
  flex:1;min-height:110px;display:flex;align-items:center;justify-content:center;text-align:center;
  color:#fff;font-weight:700;font-size:clamp(16px,1.8vw,22px);padding:10px 26px 10px 40px;
  clip-path:polygon(0 0, calc(100% - 26px) 0, 100% 50%, calc(100% - 26px) 100%, 0 100%, 26px 50%);
}
.step:first-child{clip-path:polygon(0 0, calc(100% - 26px) 0, 100% 50%, calc(100% - 26px) 100%, 0 100%);padding-left:26px}
.step:last-child{clip-path:polygon(0 0, 100% 0, 100% 100%, 0 100%, 26px 50%)}
.step--1{background:var(--orange)}
.step--2,.step--3{background:var(--purple-mid)}
.step--4{background:var(--purple)}
.flow__divider{height:1px;background:var(--line);margin:44px 0}

/* =========================================================
   ENTRY CTA
   ========================================================= */
.entry{background:linear-gradient(135deg,#3a2b57 0%,#282438 100%);color:#fff;padding:76px 0}
.entry__head{font-size:clamp(24px,3.4vw,36px);font-weight:600;line-height:1.5;margin-bottom:34px}
.entry__card{
  background:var(--lilac-2);border-radius:var(--radius-lg);padding:40px 48px;
  display:flex;align-items:center;justify-content:space-between;gap:30px;flex-wrap:wrap;box-shadow:var(--shadow-md);
}
.entry__card p{color:var(--purple);font-weight:700;font-size:clamp(18px,2.2vw,26px);line-height:1.6}

/* =========================================================
   FOOTER
   ========================================================= */
.footer{background:#ccccccff;color:var(--ink);padding:56px 0 30px}
.footer__grid{display:flex;flex-wrap:wrap;gap:56px;justify-content:space-between}
.footer .logo{color:var(--purple-deep);margin-bottom:8px}
.footer__cols{display:flex;gap:64px;flex-wrap:wrap}
.footer__col h4{font-family:var(--font);font-weight:600;color:var(--purple);letter-spacing:.06em;font-size:15px;margin-bottom:16px}
.footer__col a{display:block;font-size:14.5px;font-weight:500;color:var(--ink);padding:6px 0;transition:color .2s}
.footer__col a:hover{color:var(--purple)}
.footer__bottom{border-top:1px solid rgba(51,51,51,.18);margin-top:40px;padding-top:20px;text-align:center;font-size:13.5px;color:var(--ink-soft)}

/* =========================================================
   Reveal-on-scroll (subtle)
   ========================================================= */
.js .reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width:1024px){
  .members__grid{grid-template-columns:repeat(2,1fr)}
  .hero__inner{gap:32px}
}
@media (max-width:860px){
  :root{--nav-h:70px}
  .nav__links,.nav__cta .btn{display:none}
  .nav__burger{display:flex}
  /* mobile dropdown */
  .nav__links{
    position:absolute;top:var(--nav-h);left:0;right:0;flex-direction:column;gap:0;
    background:rgba(255,255,255,.97);backdrop-filter:blur(12px);
    padding:10px 0;box-shadow:var(--shadow-md);
    max-height:0;overflow:hidden;transition:max-height .35s ease,padding .35s ease;
  }
  .nav__toggle:checked ~ .nav__links{display:flex;max-height:420px;padding:12px 0 20px}
  .nav__links a{padding:14px 28px;width:100%}
  .nav__links a::after{display:none}
  .nav__links .btn{display:inline-flex;margin:12px 28px 0}

  /* hero → 縦積みで重ならない配置（タブレット/スマホ） */
  .hero__banner{aspect-ratio:1/1.18}
  .hero__band{top:50%;transform:translate(-50%,-50%);width:180%}
  .c-sleep{left:11%;top:1%;width:78%;z-index:3}
  .c-man{left:1%;top:55%;width:45%}
  .c-woman{left:54%;top:55%;width:45%}
  .c-empty,.c-empty2{display:none}
  .hero__copy{position:static;transform:none;flex-direction:column;align-items:center;text-align:center;gap:22px;padding:8px 20px 36px;max-width:none}
  .hero__actions{width:100%;max-width:360px}
  .about__grid{grid-template-columns:1fr;gap:32px}
  .jobs__grid{grid-template-columns:1fr}
  .creed__grid{grid-template-columns:1fr;max-width:460px;margin-inline:auto}
  .benefits__grid{grid-template-columns:1fr;max-width:520px;margin-inline:auto}
  .office__grid{grid-template-columns:1fr}
  .office__info{grid-template-columns:1fr;gap:28px;padding:30px}
  .office__info .divider{width:100%;height:2px}
  .jobcard--wide .jobcard__foot{margin-left:0}
}
@media (max-width:640px){
  .section{padding:60px 0}
  .container{padding-inline:20px}
  .jobs__panel{padding:24px 18px}
  .members__grid{grid-template-columns:1fr 1fr;gap:16px}
  .member__meta{padding:12px 14px}
  .entry__card{padding:28px 24px;justify-content:center;text-align:center}
  .entry__card p{width:100%}
  /* flow → vertical stacks with down arrows */
  .flow__row{flex-direction:column;gap:0}
  .step,.step:first-child,.step:last-child{
    clip-path:none;border-radius:14px;width:100%;min-height:70px;padding:14px 20px;
    position:relative;
  }
  .step:not(:last-child){margin-bottom:34px}
  .step:not(:last-child)::after{
    content:"";position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);
    width:0;height:0;border-style:solid;border-width:16px 13px 0 13px;
    border-color:var(--purple-soft) transparent transparent transparent;
  }
  .btn{width:100%}
  .hero__actions .btn{width:100%}
}
@media (max-width:400px){

}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .js .reveal{opacity:1;transform:none}
  html{scroll-behavior:auto}
}

.meet__tileBtn{position:relative;height:100%;width:100%;padding:0;border:0;background:none;cursor:pointer;border-radius:10px;overflow:hidden;display:block}
.meet__tileBtn .meet__tile{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.meet__tileBtn::after{content:"";position:absolute;inset:0;background:rgba(112,32,130,0);transition:background .25s}
.meet__tileBtn:hover .meet__tile,.meet__tileBtn:focus-visible .meet__tile{transform:scale(1.05)}

.pf-overlay{font-family:var(--font);position:fixed;inset:0;z-index:1000;background:rgba(28,22,42,.58);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:40px 18px;overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .28s ease,visibility .28s}
.pf-overlay.open{opacity:1;visibility:visible}
.pf-modal{position:relative;width:100%;max-width:660px;margin:auto;background:#FFFFFF;border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(35,25,60,.45);transform:translateY(14px) scale(.985);transition:transform .28s ease}
.pf-overlay.open .pf-modal{transform:none}
